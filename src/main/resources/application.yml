spring:
  application:
    name: lsk-inventory

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lsk_inventory}
    username: ${DB_USER:lsk}
    password: ${DB_PASSWORD:lsk}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 8
        prefetch: 10
        default-requeue-rejected: false     # failed for good -> DLQ
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-attempts: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

lsk:
  jobs:
    enabled: true
    abc-analysis-cron: "0 30 2 * * *"
    batches-expired-cron: "0 0 1 * * *"
  inventory:
    abc-window-days: 90
    class-a-limit: 0.80
    class-b-limit: 0.95
    sap-max-attempts: 5
    sap-send-timeout: 10m
  sap:
    enabled: ${SAP_ENABLED:false}
    base-url: ${SAP_URL:https://localhost:50000}
    company-db: ${SAP_COMPANY_DB:SBODEMOBR}
    username: ${SAP_USER:manager}
    password: ${SAP_PASSWORD:manager}
    warehouse-code: ${SAP_WAREHOUSE:01}
    insecure-ssl: ${SAP_INSECURE_SSL:false}   # DEV only, for self-signed certificates
    send-batches: true
