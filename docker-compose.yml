services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lsk_estoque
      POSTGRES_USER: lsk
      POSTGRES_PASSWORD: lsk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsk -d lsk_estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lsk_estoque
      DB_USER: lsk
      DB_PASSWORD: lsk
      RABBIT_HOST: rabbitmq
      # SAP is off by default. To use the mock (node mock-sap.js on the host):
      #   $env:APP_SAP_ENABLED="true"; docker compose up -d
      SAP_ENABLED: ${APP_SAP_ENABLED:-false}
      SAP_URL: ${APP_SAP_URL:-http://host.docker.internal:50000}
      SAP_COMPANY_DB: ${APP_SAP_COMPANY_DB:-MOCK}
      SAP_USER: ${APP_SAP_USER:-mock}
      SAP_PASSWORD: ${APP_SAP_PASSWORD:-mock}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata: